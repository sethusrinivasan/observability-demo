apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-python-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observability-python-app
  template:
    metadata:
      labels:
        app: observability-python-app
    spec:
      containers:
      - name: observability-python-app
        image: observability-python-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
        - name: OTEL_SERVICE_NAME
          value: "observability-python-app"
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "observability"
        - name: POSTGRES_USER
          value: "observability"
        - name: POSTGRES_PASSWORD
          value: "observability"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: observability-python-app
spec:
  selector:
    app: observability-python-app
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30001
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary
  template:
    metadata:
      labels:
        app: canary
    spec:
      containers:
      - name: canary
        image: observability-canary:latest
        imagePullPolicy: Never
        env:
        - name: APP_BASE_URL
          value: "http://observability-python-app:5000"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
        - name: CANARY_TPS
          value: "24"

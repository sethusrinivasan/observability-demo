[pytest]
# Disable the cache plugin entirely — avoids PytestCacheWarning when
# .pytest_cache is owned by root (e.g. after a Docker run).
addopts = -p no:cacheprovider

# Suppress DeprecationWarnings from third-party packages (grpcio/protobuf)
# that use the deprecated PyType_Spec metaclass API. These are not our code
# and will be fixed upstream when those packages drop Python 3.13 support.
filterwarnings =
    ignore::DeprecationWarning:google.*
    ignore:Type google.*PyType_Spec.*:DeprecationWarning

# Suppress OTel SDK retry stderr noise when running tests outside Docker
# (the SDK tries to export to localhost:4317 which isn't running on the host)
log_cli = false
log_level = ERROR

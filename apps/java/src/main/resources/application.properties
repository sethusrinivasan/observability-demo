# Spring Boot Actuator is exposed only by the Java app.
# Python and Rust keep the shared demo routes and do not serve these.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,demo
management.info.env.enabled=true

info.app.name=observability-java-app
info.app.version=1.0.1
info.app.language=java
info.app.framework=spring-boot
info.app.sample=Actuator health and info. The Python and Rust apps do not expose this.

server.port=${PORT:8080}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:observability}?sslmode=prefer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:observability}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:observability}}

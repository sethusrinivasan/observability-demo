services:
  # OpenTelemetry Collector - receives and routes all telemetry
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: otel-collector
    restart: unless-stopped
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "55679:55679" # zpages (browser)
    depends_on:
      - tempo
      - mimir
      - loki
    networks:
      - observability-network

  # Grafana Tempo - distributed tracing backend
  tempo:
    image: grafana/tempo:3.0.0
    container_name: tempo
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./config/tempo.yaml:/etc/tempo/config.yaml
      - tempo-data:/var/tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports:
      - "3200:3200"   # Tempo API
    networks:
      - observability-network

  redpanda:
    image: redpandadata/redpanda:v26.2.3
    container_name: redpanda
    restart: unless-stopped
    ports:
      - "9092:9092"   # Kafka API for Tempo
      - "9644:9644"   # Admin API (browser)
    command: >
      redpanda start --overprovisioned
      --mode=dev-container
      --kafka-addr=PLAINTEXT://0.0.0.0:9092
      --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - observability-network

  # Grafana Mimir - long-term metrics storage
  mimir:
    image: grafana/mimir:3.2.1
    container_name: mimir
    restart: unless-stopped
    volumes:
      - ./config/mimir.yaml:/etc/mimir/config.yaml
      - mimir-data:/data
    command: ["-config.file=/etc/mimir/config.yaml"]
    ports:
      - "9009:9009"   # Mimir API
    networks:
      - observability-network

  # Grafana Loki - log aggregation
  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    volumes:
      - ./config/loki.yaml:/etc/loki/config.yaml
      - loki-data:/loki
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "3100:3100"   # Loki API
    networks:
      - observability-network

  # Grafana - visualization and dashboards
  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_INSTALL_PLUGINS=redis-datasource
      # Point Grafana at the renderer sidecar
      - GF_RENDERING_SERVER_URL=http://grafana-renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_RENDERING_RENDERER_TOKEN=observability-demo
      - GF_LOG_FILTERS=rendering:debug
    volumes:
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./config/grafana-dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/dashboard.yml
      - ./config/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"   # Grafana UI
    depends_on:
      - tempo
      - mimir
      - loki
      - grafana-renderer
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - observability-network

  # Grafana image renderer — headless Chromium sidecar for PNG exports
  grafana-renderer:
    image: grafana/grafana-image-renderer@sha256:4c5574b3261ca7566fbca11d3fb3615bd8e753c69cb4fe9108f3ec8d1d3841d6
    container_name: grafana-renderer
    restart: unless-stopped
    environment:
      - ENABLE_METRICS=true
      - AUTH_TOKEN=observability-demo
    ports:
      - "8081:8081"
    networks:
      - observability-network

  postgres:
    image: postgres:18.6
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observability -d observability"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=observability
      - POSTGRES_PASSWORD=observability
      - POSTGRES_DB=observability
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - observability-network

  postgres-exporter:
    image: bitnami/postgres-exporter@sha256:59b0b9ddee90a32fd24cc6345d65ac7308b211f932da8fc1e4270e421e34fd7e
    container_name: postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://observability:observability@postgres:5432/observability?sslmode=disable
      - PG_EXPORTER_DISABLE_SETTINGS_METRICS=false
      - PG_EXPORTER_DISABLE_DEFAULT_METRICS=false
      # Bitnami's image runs Go in FIPS-only mode, which rejects this demo password
      # and leaves pg_up at 0, so the Grafana version widget stays empty.
      - GODEBUG=fips140=off
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - observability-network

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    depends_on:
      - mimir
      - postgres-exporter
    networks:
      - observability-network

  # Python observability app
  observability-python-app:
    build: .
    container_name: observability-python-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=observability-python-app
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=observability
      - POSTGRES_USER=observability
      - POSTGRES_PASSWORD=observability
    depends_on:
      - otel-collector
      - tempo
      - mimir
      - loki
      - postgres
    networks:
      - observability-network

  # Java observability app
  observability-java-app:
    build: ./java-app
    container_name: observability-java-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=observability-java-app
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/observability
      - SPRING_DATASOURCE_USERNAME=observability
      - SPRING_DATASOURCE_PASSWORD=observability
      - OTEL_RESOURCE_ATTRIBUTES=language=java,service.name=observability-java-app
      - OTEL_LOGS_EXPORTER=otlp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      - otel-collector
      - postgres
    networks:
      - observability-network

  # Rust observability app
  observability-rust-app:
    build: ./rust-app
    container_name: observability-rust-app
    restart: unless-stopped
    ports:
      - "8083:8081"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - DATABASE_URL=postgres://observability:observability@postgres:5432/observability
    depends_on:
      - otel-collector
      - postgres
    networks:
      - observability-network

  # Node.js observability app
  observability-node-app:
    build: ./node-app
    container_name: observability-node-app
    restart: unless-stopped
    ports:
      - "8084:8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=observability-node-app
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=observability
      - POSTGRES_USER=observability
      - POSTGRES_PASSWORD=observability
      - OTEL_RESOURCE_ATTRIBUTES=language=nodejs,service.name=observability-node-app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      - otel-collector
      - postgres
    networks:
      - observability-network

  # Go observability app
  observability-go-app:
    build: ./go-app
    container_name: observability-go-app
    restart: unless-stopped
    ports:
      - "8086:8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=observability-go-app
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=observability
      - POSTGRES_USER=observability
      - POSTGRES_PASSWORD=observability
      - OTEL_RESOURCE_ATTRIBUTES=language=golang,service.name=observability-go-app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      - otel-collector
      - postgres
    networks:
      - observability-network

  observability-dotnet-app:
    build:
      context: ./dotnet-app
      dockerfile: Dockerfile
    container_name: observability-dotnet-app
    restart: unless-stopped
    ports:
      - "8087:8080"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=observability
      - POSTGRES_USER=observability
      - POSTGRES_PASSWORD=observability
      - DATABASE_URL=postgres://observability:observability@postgres:5432/observability
      - OTEL_RESOURCE_ATTRIBUTES=language=csharp,service.name=observability-dotnet-app
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Production
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      - otel-collector
      - postgres
    networks:
      - observability-network

  # C observability app
  observability-c-app:
    build: ./c-app
    container_name: observability-c-app
    restart: unless-stopped
    ports:
      - "8088:8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=observability
      - POSTGRES_USER=observability
      - POSTGRES_PASSWORD=observability
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      - otel-collector
      - postgres
    networks:
      - observability-network

  # Synthetic canary — isolated container that exercises every endpoint
  # at a calibrated rate (24 TPS → ~50% saturation of one core).
  # Runs independently so canary failures never affect the app process.
  canary:
    build: ./canary
    container_name: canary
    restart: unless-stopped
    ports:
      - "8085:8085"
      - "80:8085"
    environment:
      - APP_BASE_URL=http://observability-python-app:5000
      - JAVA_APP_BASE_URL=http://observability-java-app:8080
      - RUST_APP_BASE_URL=http://observability-rust-app:8081
      - NODE_APP_BASE_URL=http://observability-node-app:8080
      - GO_APP_BASE_URL=http://observability-go-app:8080
      - DOTNET_APP_BASE_URL=http://observability-dotnet-app:8080
      - C_APP_BASE_URL=http://observability-c-app:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - MIMIR_URL=http://mimir:9009
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=observability
      - POSTGRES_USER=observability
      - POSTGRES_PASSWORD=observability
      - TEMPO_URL=http://tempo:3200
      - LOKI_URL=http://loki:3100
      - PROMETHEUS_URL=http://prometheus:9090
      - GRAFANA_URL=http://grafana:3000
      - REDPANDA_ADMIN_URL=http://redpanda:9644
      - CANARY_TPS=6
      - CANARY_PORT=8085
      - CANARY_HOST_IP=${CANARY_HOST_IP:-${HOST_IP:-}}
      - SHOWCASE_URL_FILE=/app/.showcase/url
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./canary/canary.py:/app/canary.py
      - ./canary/sql_guard.py:/app/sql_guard.py
      - ./.showcase:/app/.showcase
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - observability-python-app
      - observability-java-app
      - observability-rust-app
      - observability-node-app
      - observability-go-app
      - observability-dotnet-app
      - observability-c-app
      - postgres
      - otel-collector
      - mimir
    networks:
      - observability-network

  # Valkey - Redis fork for storing custom metrics
  valkey:
    image: valkey/valkey:9.1.2
    container_name: valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - observability-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.92.1
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=valkey:6379
    ports:
      - "9121:9121"
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - observability-network

  # Cloudflare Tunnel — Zero-port-forwarding public showcase bridge
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-${TUNNEL_TOKEN:-}}
    networks:
      - observability-network
    depends_on:
      - canary
      - grafana
    profiles:
      - tunnel
      - showcase

networks:
  observability-network:
    driver: bridge


volumes:
  tempo-data:
  mimir-data:
  loki-data:
  grafana-data:
  postgres-data:
  prometheus-data:

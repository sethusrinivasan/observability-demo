name: Live Showcase Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  verify:
    name: Verify Live Showcase
    runs-on: ubuntu-latest
    env:
      LIVE_URL: ${{ vars.LIVE_SHOWCASE_URL || 'https://styles-settle-verbal-antique.trycloudflare.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest pytest-timeout

      - name: Probe live showcase endpoint
        run: |
          echo "Checking live showcase at: $LIVE_URL"
          for attempt in $(seq 1 12); do
            code=$(curl -s -m 5 -o /dev/null -w "%{http_code}" "$LIVE_URL/health" || echo "000")
            echo "Attempt $attempt: /health returned HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Showcase is online and responding."
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: Showcase did not respond with HTTP 200 within 60 seconds."
          exit 1

      - name: Run live showcase test suite
        run: |
          pytest tests/test_live_showcase.py tests/test_sql_guard.py -v --tb=short

name: "Deploy Azure Terraform Infrastructure (OIDC)"

on:
  push:
    branches:
      - main
    paths:
      - "deployment/terraform-azure/**"
      - "deployment/terraform-azure-foundation/**"
      - ".github/workflows/deploy-azure-terraform.yml"
  pull_request:
    branches:
      - main
    paths:
      - "deployment/terraform-azure/**"
      - "deployment/terraform-azure-foundation/**"
      - ".github/workflows/deploy-azure-terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to execute"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - plan
          - "Destroy and redeploy"
          - destroy

# Critical for Azure Workload Identity Federation: id-token write permission generates the OIDC JWT
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: "Azure Terraform Plan & Apply"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment/terraform-azure

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Azure Login (OIDC Workload Identity Federation)
        id: azure_login
        uses: azure/login@v2
        continue-on-error: true
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || 'c3b53c15-0583-4a11-85e7-a92a543ec055' }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || '72f988bf-86f1-41af-91ab-2d7cd011db47' }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || '00000000-0000-0000-0000-000000000000' }}

      - name: Pre-flight Bootstrap & Azure Foundation Verification
        id: bootstrap
        continue-on-error: true
        run: |
          LOCATION="${{ secrets.AZURE_LOCATION || 'eastus2' }}"
          RG_NAME="rg-observability-demo-prod"
          echo "=== 1. Verifying Azure Resource Group & OIDC Identity ==="
          if command -v az >/dev/null 2>&1; then
            echo "Azure CLI available. Checking Resource Group: ${RG_NAME}..."
            az group show --name "${RG_NAME}" 2>/dev/null || echo "Resource Group will be managed by Terraform foundation."

            if [ -d "../terraform-azure-foundation" ]; then
              echo "Checking foundational Azure infrastructure..."
              terraform -chdir="../terraform-azure-foundation" init -backend=false
              terraform -chdir="../terraform-azure-foundation" apply -auto-approve -var="azure_location=${LOCATION}" || true
              STORAGE_ACCOUNT=$(terraform -chdir="../terraform-azure-foundation" output -raw storage_account_name 2>/dev/null || echo "")
              ACR_SERVER=$(terraform -chdir="../terraform-azure-foundation" output -raw acr_login_server 2>/dev/null || echo "")
              ACR_NAME=$(terraform -chdir="../terraform-azure-foundation" output -raw acr_name 2>/dev/null || echo "")
              echo "FOUNDATION_STORAGE_ACCOUNT=${STORAGE_ACCOUNT}" >> $GITHUB_ENV
              echo "FOUNDATION_ACR_SERVER=${ACR_SERVER}" >> $GITHUB_ENV
              echo "FOUNDATION_ACR_NAME=${ACR_NAME}" >> $GITHUB_ENV
            fi
          fi

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -diff
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=5
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES: Initializing Terraform with Azure Blob backend..."
            set +e
            INIT_OUT=$(terraform init -no-color 2>&1)
            INIT_RC=$?
            set -e
            echo "$INIT_OUT"

            if [ $INIT_RC -eq 0 ]; then
              echo "Terraform initialization succeeded on attempt $attempt."
              exit 0
            fi

            # Fast-fail immediately on permanent unrecoverable backend errors
            if echo "$INIT_OUT" | grep -qiE "BlobNotFound|ContainerNotFound|AuthenticationFailed|AuthorizationPermissionMismatch|ResourceNotFound|InvalidAuthenticationInfo"; then
              echo "::error::Permanent unrecoverable backend error detected during 'terraform init'. Retrying will not resolve this."
              echo "::error::Fast-failing to preserve CI runner minutes. Ensure the Azure Storage backend exists and credentials are valid."
              exit 1
            fi

            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "Terraform init failed after $MAX_RETRIES attempts."
              exit 1
            fi
            echo "Terraform init failed (transient condition). Backing off for ${RETRY_DELAY}s before retrying..."
            sleep $RETRY_DELAY
            RETRY_DELAY=$((RETRY_DELAY * 2))
          done

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Archive Active Azure Blob Telemetry Container with Numbered Suffix
        id: archive_blob
        if: github.ref == 'refs/heads/main' && (github.event.inputs.action == 'Destroy and redeploy' || github.event.inputs.action == 'destroy-and-redeploy' || github.event.inputs.action == 'destroy')
        run: |
          LOCATION="${{ secrets.AZURE_LOCATION || 'eastus2' }}"
          BASE_CONTAINER="telemetry-lake"
          echo "Checking active Azure blob container: ${BASE_CONTAINER} prior to destroy..."
          # If az cli authenticated, archive blobs with numbered suffix
          if command -v az >/dev/null 2>&1; then
            STORAGE_ACCOUNT=$(az storage account list --resource-group rg-observability-demo-prod --query "[0].name" -o tsv 2>/dev/null || echo "")
            if [ -n "$STORAGE_ACCOUNT" ]; then
              echo "Found storage account: $STORAGE_ACCOUNT. Checking blobs..."
              BLOB_COUNT=$(az storage blob list --account-name "$STORAGE_ACCOUNT" --container-name "$BASE_CONTAINER" --auth-mode login --query "length(@)" -o tsv 2>/dev/null || echo "0")
              if [ "$BLOB_COUNT" -gt 0 ]; then
                SUFFIX=1
                ARCHIVE_CONTAINER="${BASE_CONTAINER}-${SUFFIX}"
                while az storage container exists --account-name "$STORAGE_ACCOUNT" --name "$ARCHIVE_CONTAINER" --auth-mode login --query "exists" -o tsv 2>/dev/null | grep -q "true"; do
                  SUFFIX=$((SUFFIX + 1))
                  ARCHIVE_CONTAINER="${BASE_CONTAINER}-${SUFFIX}"
                done
                echo "Archiving ${BASE_CONTAINER} -> ${ARCHIVE_CONTAINER}"
                az storage container create --account-name "$STORAGE_ACCOUNT" --name "$ARCHIVE_CONTAINER" --auth-mode login 2>/dev/null || true
                az storage blob copy batch --source-account-name "$STORAGE_ACCOUNT" --source-container "$BASE_CONTAINER" --destination-account-name "$STORAGE_ACCOUNT" --destination-container "$ARCHIVE_CONTAINER" --auth-mode login 2>/dev/null || true
                az storage blob delete-batch --account-name "$STORAGE_ACCOUNT" --source "$BASE_CONTAINER" --auth-mode login 2>/dev/null || true
                echo "Archive completed successfully: ${ARCHIVE_CONTAINER}"
              fi
            fi
          fi

      - name: Terraform Destroy Workload (Clean Slate for Redeploy)
        id: destroy
        if: github.ref == 'refs/heads/main' && (github.event.inputs.action == 'Destroy and redeploy' || github.event.inputs.action == 'destroy-and-redeploy' || github.event.inputs.action == 'destroy')
        run: |
          LOCATION="${{ secrets.AZURE_LOCATION || 'eastus2' }}"
          echo "Azure workload teardown in deployment/terraform-azure: Foundational Storage, OIDC Identity, and ACR remain completely isolated in deployment/terraform-azure-foundation."
          MAX_RETRIES=3
          RETRY_DELAY=10
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES: Destroying Azure workload resources..."
            if terraform destroy -auto-approve -var="azure_location=${LOCATION}"; then
              echo "Azure workload resources destroyed successfully."
              exit 0
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "Terraform destroy failed after $MAX_RETRIES attempts."
              exit 1
            fi
            echo "Workload destroy encountered a transient conflict. Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
            RETRY_DELAY=$((RETRY_DELAY * 2))
          done

      - name: Terraform Plan
        id: plan
        if: github.event.inputs.action != 'destroy'
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=5
          EXTRA_VARS=""
          [ -n "$FOUNDATION_STORAGE_ACCOUNT" ] && EXTRA_VARS="$EXTRA_VARS -var=storage_account_name=$FOUNDATION_STORAGE_ACCOUNT"
          [ -n "$FOUNDATION_ACR_SERVER" ] && EXTRA_VARS="$EXTRA_VARS -var=acr_login_server=$FOUNDATION_ACR_SERVER"
          [ -n "$FOUNDATION_ACR_NAME" ] && EXTRA_VARS="$EXTRA_VARS -var=acr_name=$FOUNDATION_ACR_NAME"

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES: Generating Azure execution plan..."
            if terraform plan -no-color \
              -var="azure_location=${{ secrets.AZURE_LOCATION || 'eastus2' }}" \
              $EXTRA_VARS \
              -out=tfplan; then
              echo "Azure Terraform plan generated successfully."
              exit 0
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "Terraform plan failed after $MAX_RETRIES attempts."
              exit 1
            fi
            echo "Terraform plan failed. Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
            RETRY_DELAY=$((RETRY_DELAY * 2))
          done

      - name: Terraform Apply
        id: apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.action == 'apply' || github.event.inputs.action == 'Destroy and redeploy' || github.event.inputs.action == 'destroy-and-redeploy')
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=10
          EXTRA_VARS=""
          [ -n "$FOUNDATION_STORAGE_ACCOUNT" ] && EXTRA_VARS="$EXTRA_VARS -var=storage_account_name=$FOUNDATION_STORAGE_ACCOUNT"
          [ -n "$FOUNDATION_ACR_SERVER" ] && EXTRA_VARS="$EXTRA_VARS -var=acr_login_server=$FOUNDATION_ACR_SERVER"
          [ -n "$FOUNDATION_ACR_NAME" ] && EXTRA_VARS="$EXTRA_VARS -var=acr_name=$FOUNDATION_ACR_NAME"

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES: Applying Azure Terraform configuration..."
            if terraform apply -auto-approve tfplan; then
              echo "Azure Terraform apply completed successfully."
              exit 0
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "Terraform apply failed after $MAX_RETRIES attempts."
              exit 1
            fi
            echo "Terraform apply encountered an error. Re-generating plan and retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
            RETRY_DELAY=$((RETRY_DELAY * 2))
            terraform plan -no-color -var="azure_location=${{ secrets.AZURE_LOCATION || 'eastus2' }}" $EXTRA_VARS -out=tfplan || true
          done

      - name: Verify Live Azure Deployment & Telemetry Lake
        id: verify
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.action == 'apply' || github.event.inputs.action == 'Destroy and redeploy' || github.event.inputs.action == 'destroy-and-redeploy')
        run: |
          CANARY_URL=$(terraform output -raw canary_dashboard_url 2>/dev/null || echo "")
          COLLECTOR_URL=$(terraform output -raw telemetry_collector_url 2>/dev/null || echo "")
          POSTGRES_HOST=$(terraform output -raw postgres_fqdn 2>/dev/null || echo "")
          echo "Azure Canary Dashboard: ${CANARY_URL}"
          echo "Azure Telemetry Receiver: ${COLLECTOR_URL}"
          echo "Azure PostgreSQL Flexible Server: ${POSTGRES_HOST}"

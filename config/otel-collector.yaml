receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  resource:
    attributes:
      - key: environment
        value: local-dev
        action: upsert
  transform:
    log_statements:
      - context: log
        statements:
          - set(attributes["language"], resource.attributes["language"])
          - set(attributes["service_name"], resource.attributes["service.name"])

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheusremotewrite/mimir:
    endpoint: http://mimir:9009/api/v1/push
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  otlphttp/s3_lake:
    endpoint: http://custom-telemetry-receiver:4318
    tls:
      insecure: true
  debug:
    verbosity: basic

extensions:
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/tempo, otlphttp/s3_lake, debug]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheusremotewrite/mimir, otlphttp/s3_lake, debug]
    logs:
      receivers: [otlp]
      processors: [resource, transform, batch]
      exporters: [otlphttp/loki, otlphttp/s3_lake, debug]